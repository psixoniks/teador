<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoNoteVisual</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}

.bar{height:16px;flex:none;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}.bar::before{content:"";width:28px;height:3px;border-radius:2px;background:var(--ln)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px}
.card textarea{flex:1;width:100%;resize:none;background:none;border:0;outline:0;color:var(--ink);font:inherit;min-height:0}

.card a{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.h::after{content:"";position:absolute;inset:-9px}

.card:hover .h,.card.sel .h,#cv[data-tool=link] .h{opacity:1}.h:hover{transform:scale(1.35)}
@media(hover:none){.h{opacity:.9}}
.fl{position:absolute;z-index:5;background:var(--pn);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:var(--sh);border-radius:14px}

.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}.brand svg{width:28px;height:28px}

.sp{width:1px;height:22px;background:var(--ln);margin:0 4px;flex:none}

.sw{display:flex;flex-wrap:wrap;gap:8px}.sw button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{font-size:12px;padding:4px 8px}

.card{cursor:grab}
.h{z-index:2}.rz{position:absolute;touch-action:none;z-index:1}
.rz.n,.rz.s{left:10px;right:10px;height:10px;cursor:ns-resize}.rz.n{top:-5px}.rz.s{bottom:-5px}
.rz.e,.rz.w{top:10px;bottom:10px;width:10px;cursor:ew-resize}.rz.e{right:-5px}.rz.w{left:-5px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:18px;height:18px}
.rz.ne{top:-6px;right:-6px;cursor:nesw-resize}.rz.nw{top:-6px;left:-6px;cursor:nwse-resize}.rz.se{bottom:-6px;right:-6px;cursor:nwse-resize}.rz.sw{bottom:-6px;left:-6px;cursor:nesw-resize}
.rz.se::before{content:"";position:absolute;right:7px;bottom:7px;width:12px;height:12px;border-radius:0 0 6px 0;opacity:.5;transition:opacity .15s;background:linear-gradient(135deg,transparent 48%,var(--mu) 48%,var(--mu) 58%,transparent 58%,transparent 70%,var(--mu) 70%,var(--mu) 80%,transparent 80%)}.card:hover .rz.se::before,.card.sel .rz.se::before{opacity:1}

#cv{transition:background-position .25s cubic-bezier(.2,.8,.2,1),background-size .25s cubic-bezier(.2,.8,.2,1)}#world{transition:transform .25s cubic-bezier(.2,.8,.2,1)}#cv.live,#cv.live #world{transition:none}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font:600 14px system-ui,sans-serif;cursor:pointer;transition:transform .1s,opacity .15s}.sbtn:hover{opacity:.88}.sbtn:active{transform:scale(.95)}
@media(max-width:560px){.brand span{display:none}}
#shot{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}#shot.on{display:flex}#shot .box{position:relative;width:min(560px,92%);max-height:92%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}#shimg{width:100%;border-radius:8px;border:1px solid var(--ln)}

#nrs{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}
#nc{color:var(--mu);font-weight:400;margin-left:4px}
#nq{background:var(--cd);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;font:inherit;width:100%}

.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit;transition:.15s}
.ni:hover{background:var(--ln)}.ni.a{border-color:var(--ink)}.ni span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.ni svg{flex:none;color:var(--mu)}
@media(max-width:720px){#nl{width:min(80%,320px);max-height:calc(100% - 170px)}#nrs{display:none}}
</style></head>
<body>
<div id="app">
<main id="cv" data-tool="select"><div id="world"><svg id="svg"></svg></div></main>
<header id="top" class="fl"></header>
<nav id="bar" class="fl"></nav>
<aside id="nl" class="fl"><div id="nrs"></div><b>Заметки <span id="nc"></span></b><button class="btn" id="nnew">+ Новая заметка</button><input id="nq" placeholder="Поиск…" aria-label="Поиск"><div id="nlist"></div></aside>
<aside id="ins" class="fl"><div id="rs"></div><div id="insb"></div></aside>
<div id="dlg"><div class="box fl"><b>Данные графа (JSON)</b><textarea id="dj" spellcheck="false"></textarea>
<div class="row"><button class="btn" id="dcopy">Копировать</button><button class="btn" id="dapply">Загрузить из текста</button><button class="btn" id="dfile">Из файла…</button><button class="btn" id="dclose">Закрыть</button></div></div></div>
<div id="st"><div class="lg" id="lg"></div><h1>GeoNoteVisual</h1><p>Заметки, связи и свободное полотно — всё в одном месте</p><button id="go">Открыть рабочее поле</button></div>
<div id="shot"><div class="box fl"><b>Картинка готова</b><span style="color:var(--mu)">Нажмите на изображение и удерживайте (или правая кнопка мыши), чтобы сохранить в фото.</span><img id="shimg" alt=""><div class="row"><button class="btn" id="shclose">Закрыть</button></div></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden><input type="file" id="jf" accept=".json,application/json" hidden>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv');
const IC={mouse:'<path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.12 1.58a2 2 0 0 0-1.44 1.43l-1.58 6.13a.5.5 0 0 1-.95.06z"/>',plus:'<path d="M5 12h14M12 5v14"/>',arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',fit:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',type:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',lines:'<path d="M4 6h16M4 12h16M4 18h10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',note:'<path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l7-7V5a2 2 0 0 0-2-2z"/><path d="M15 21v-6h6"/>'};
const I=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const LOGO='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 4 56 18v28L32 60 8 46V18z" opacity=".45"/><path d="M32 4v16M56 18 42 27M56 46 42 37M32 60V44M8 46l14-9M8 18l14 9"/><rect x="22" y="20" width="20" height="24" rx="3" fill="var(--bg)"/><path d="M27 28h10M27 33h10M27 38h6"/><g fill="currentColor" stroke="none"><circle cx="32" cy="4" r="3"/><circle cx="56" cy="18" r="3"/><circle cx="56" cy="46" r="3"/><circle cx="32" cy="60" r="3"/><circle cx="8" cy="46" r="3"/><circle cx="8" cy="18" r="3"/></g></svg>';
const LBL={note:'Заметка',title:'Заголовок',text:'Текст',link:'Ссылка',image:'Изображение'},ICO={note:'note',title:'type',text:'lines',link:'link',image:'image'},H={note:150,title:64,text:110,link:90,image:170},WD={note:220,title:260,text:220,link:240,image:240};
const N={t:[0,-1],b:[0,1],l:[-1,0],r:[1,0]},KEY='gnv1';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=k=>Math.min(2.5,Math.max(.2,k));
const FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',fsOf=c=>c.fs||Math.round(Math.max(8,Math.min(120,(c.type==='title'?20:14)*Math.min(c.w/WD[c.type],c.h/H[c.type])))*10)/10;
const RB=['#e53935','#fb8c00','#fdd835','#43a047','#29b6f6','#1e5bd8','#8e24aa'];
const fgFor=h=>{const n=parseInt(h.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;return l>.55?'#111':'#f2f2f2'};
const seed=()=>({cards:[{id:'a',type:'title',x:-130,y:-170,w:260,h:64,text:'GeoNoteVisual',url:''},{id:'b',type:'note',x:-380,y:-10,w:230,h:150,text:'Двойной клик по полю или инструмент «+» — новая карточка. Тяните точки по краям, чтобы соединить карточки.',url:''},{id:'c',type:'note',x:150,y:-10,w:230,h:150,text:'Нажмите на линию: тип, цвет, толщина и подпись меняются в панели.',url:''}],edges:[{id:'e1',from:'a',fs:'b',to:'b',ts:'t',t:'arrow',color:'auto',w:2,label:'связано с'},{id:'e2',from:'a',fs:'b',to:'c',ts:'t',t:'arrow',color:'auto',w:2,label:'следствие'}],view:{x:innerWidth/2,y:innerHeight/2-20,k:innerWidth<720?.62:1},theme:'dark'});
let S,tool='select',sel=null,undo=[],redo=[],tmp='',mode=null,st;const P=new Map(),els=new Map(),uid=()=>Math.random().toString(36).slice(2,9);
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.cards&&d.edges&&d.view)return d}catch(e){}return null}
function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить: нет места')}},200)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
/* история */
const snap=()=>JSON.stringify({cards:S.cards,edges:S.edges});
function commit(){undo.push(snap());if(undo.length>100)undo.shift();redo=[]}
function restore(j){const d=JSON.parse(j);S.cards=d.cards;S.edges=d.edges;if(sel&&!(sel.k==='c'?S.cards:S.edges).some(x=>x.id===sel.id))sel=null;draw();save()}
function doUndo(){if(!undo.length)return toast('Нечего отменять');redo.push(snap());restore(undo.pop())}
function doRedo(){if(!redo.length)return toast('Нечего повторять');undo.push(snap());restore(redo.pop())}
const cur=()=>sel&&(sel.k==='e'?S.edges:S.cards).find(x=>x.id===sel.id);
/* геометрия */
const anc=(c,s)=>s==='t'?[c.x+c.w/2,c.y]:s==='b'?[c.x+c.w/2,c.y+c.h]:s==='l'?[c.x,c.y+c.h/2]:[c.x+c.w,c.y+c.h/2];
const near=(c,x,y)=>{const dx=(x-c.x-c.w/2)/c.w,dy=(y-c.y-c.h/2)/c.h;return Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'b':'t')};
function geo(p0,n0,p1,n1){const d=Math.max(50,Math.hypot(p1[0]-p0[0],p1[1]-p0[1])*.4),c0=[p0[0]+n0[0]*d,p0[1]+n0[1]*d],c1=[p1[0]+n1[0]*d,p1[1]+n1[1]*d];return{d:`M${p0}C${c0} ${c1} ${p1}`,m:[(p0[0]+3*c0[0]+3*c1[0]+p1[0])/8,(p0[1]+3*c0[1]+3*c1[1]+p1[1])/8]}}
function head(p,n,w,c){const s=9+w*2,b=[p[0]+n[0]*s,p[1]+n[1]*s],q=[-n[1]*s*.5,n[0]*s*.5];return`<polygon points="${p} ${b[0]+q[0]},${b[1]+q[1]} ${b[0]-q[0]},${b[1]-q[1]}" fill="${c}" stroke="${c}" stroke-linejoin="round"/>`}
function edges(){let h='';for(const e of S.edges){const a=S.cards.find(c=>c.id===e.from),b=S.cards.find(c=>c.id===e.to);if(!a||!b)continue;
const p0=anc(a,e.fs),p1=anc(b,e.ts),g=geo(p0,N[e.fs],p1,N[e.ts]),w=e.w||2,cl=!e.color||e.color==='auto'?'var(--ink)':e.color,on=sel&&sel.k==='e'&&sel.id===e.id;
h+=`<g class="edge${on?' sel':''}" data-id="${e.id}"><path d="${g.d}" class="hit"/><path d="${g.d}" class="ln" stroke="${cl}" stroke-width="${w}"${e.t==='dashed'?' stroke-dasharray="9 8"':''}/>`;
